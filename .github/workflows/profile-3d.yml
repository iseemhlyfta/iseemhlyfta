name: GitHub Profile 3D Contrib

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v4

      - name: Create theme config
        run: |
          cat << 'EOF' > setting.json
          {
            "type": "normal",
            "backgroundColor": "#0d1117",
            "foregroundColor": "#c9d1d9",
            "strongColor": "#ff2a4b",
            "weakColor": "#8b949e",
            "radarColor": "#ff2a4b",
            "contribColors": [
              "#161b22",
              "#4a0b15",
              "#8a1124",
              "#cc1b36",
              "#ff2a4b"
            ]
          }
          EOF

      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: setting.json

      - name: Commit & Push
        run: |
          rm -f setting.json
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          git diff --cached --quiet || git commit -m "Update 3D contrib graph"
          git push
