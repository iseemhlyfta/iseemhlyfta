<svg width="900" height="120" viewBox="0 0 900 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    
    <linearGradient id="fadeRed" x1="0" y1="0" x2="0" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff2a4b" stop-opacity="0" />
      <stop offset="55%" stop-color="#8a0a1f" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ff2a4b" stop-opacity="0.85" />
    </linearGradient>

    
    <linearGradient id="sideMaskGrad" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="white" stop-opacity="0" />
      <stop offset="18%" stop-color="white" stop-opacity="1" />
      <stop offset="82%" stop-color="white" stop-opacity="1" />
      <stop offset="100%" stop-color="white" stop-opacity="0" />
    </linearGradient>

    <mask id="softEdges">
      <rect width="900" height="120" fill="url(#sideMaskGrad)" />
    </mask>

    
    <filter id="noise" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" stitchTiles="stitch" result="grain" />
      <feColorMatrix type="saturate" values="0" in="grain" result="monoGrain" />
      <feComponentTransfer in="monoGrain" result="alphaGrain">
        <feFuncA type="linear" slope="0.22" />
      </feComponentTransfer>
      <feComposite in="alphaGrain" in2="SourceGraphic" operator="in" result="clippedGrain" />
      <feBlend mode="overlay" in="clippedGrain" in2="SourceGraphic" />
    </filter>
  </defs>

  <g mask="url(#softEdges)">
    
    <rect width="900" height="120" rx="12" fill="url(#fadeRed)" filter="url(#noise)" />
    
    <line x1="120" y1="118.5" x2="780" y2="118.5" stroke="#ff2a4b" stroke-width="2" stroke-opacity="0.9" />
  </g>
</svg>
