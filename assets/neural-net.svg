<svg width="900" height="240" viewBox="0 0 900 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    
    <radialGradient id="nnGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff2a4b" stop-opacity="0.16" />
      <stop offset="60%" stop-color="#7a0016" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0" />
    </radialGradient>

    
    <filter id="pulseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  
  <rect width="900" height="240" rx="14" fill="url(#nnGlow)" />

  
  <text x="24" y="28" fill="#ff2a4b" fill-opacity="0.65" font-family="monospace" font-size="11" letter-spacing="2">
    NEURAL TOPOLOGY // FORWARD PASS
  </text>

  
  <g stroke="#ff2a4b" stroke-opacity="0.16" stroke-width="1.2">
    
    <line x1="150" y1="65" x2="360" y2="45" />
    <line x1="150" y1="65" x2="360" y2="95" />
    <line x1="150" y1="65" x2="360" y2="145" />
    <line x1="150" y1="120" x2="360" y2="45" />
    <line x1="150" y1="120" x2="360" y2="95" />
    <line x1="150" y1="120" x2="360" y2="145" />
    <line x1="150" y1="120" x2="360" y2="195" />
    <line x1="150" y1="175" x2="360" y2="95" />
    <line x1="150" y1="175" x2="360" y2="145" />
    <line x1="150" y1="175" x2="360" y2="195" />

    
    <line x1="360" y1="45" x2="570" y2="65" />
    <line x1="360" y1="45" x2="570" y2="120" />
    <line x1="360" y1="95" x2="570" y2="65" />
    <line x1="360" y1="95" x2="570" y2="120" />
    <line x1="360" y1="95" x2="570" y2="175" />
    <line x1="360" y1="145" x2="570" y2="65" />
    <line x1="360" y1="145" x2="570" y2="120" />
    <line x1="360" y1="145" x2="570" y2="175" />
    <line x1="360" y1="195" x2="570" y2="120" />
    <line x1="360" y1="195" x2="570" y2="175" />

    
    <line x1="570" y1="65" x2="750" y2="90" />
    <line x1="570" y1="65" x2="750" y2="150" />
    <line x1="570" y1="120" x2="750" y2="90" />
    <line x1="570" y1="120" x2="750" y2="150" />
    <line x1="570" y1="175" x2="750" y2="90" />
    <line x1="570" y1="175" x2="750" y2="150" />
  </g>

  
  <g filter="url(#pulseGlow)">
    
    <circle r="3" fill="#ff2a4b">
      <animateMotion dur="2.6s" repeatCount="indefinite" path="M 150 65 L 360 95 L 570 65 L 750 90" />
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="2.6s" repeatCount="indefinite" />
    </circle>
    
    <circle r="2.8" fill="#ffffff">
      <animateMotion dur="3.1s" begin="0.4s" repeatCount="indefinite" path="M 150 120 L 360 45 L 570 120 L 750 150" />
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="3.1s" begin="0.4s" repeatCount="indefinite" />
    </circle>
    
    <circle r="3" fill="#ff2a4b">
      <animateMotion dur="2.8s" begin="0.9s" repeatCount="indefinite" path="M 150 175 L 360 145 L 570 175 L 750 150" />
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="2.8s" begin="0.9s" repeatCount="indefinite" />
    </circle>
    
    <circle r="2.5" fill="#ff6b7d">
      <animateMotion dur="3.4s" begin="1.5s" repeatCount="indefinite" path="M 150 120 L 360 195 L 570 120 L 750 90" />
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="3.4s" begin="1.5s" repeatCount="indefinite" />
    </circle>
    
    <circle r="2.8" fill="#ff2a4b">
      <animateMotion dur="2.4s" begin="1.9s" repeatCount="indefinite" path="M 150 65 L 360 145 L 570 65 L 750 150" />
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="2.4s" begin="1.9s" repeatCount="indefinite" />
    </circle>
    
    <circle r="2.5" fill="#ffffff">
      <animateMotion dur="3.0s" begin="2.3s" repeatCount="indefinite" path="M 150 175 L 360 95 L 570 175 L 750 90" />
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="3.0s" begin="2.3s" repeatCount="indefinite" />
    </circle>
  </g>

  
  <g fill="#0d1117" stroke="#ff2a4b" stroke-width="2" filter="url(#pulseGlow)">
    
    <circle cx="150" cy="65" r="6" />
    <circle cx="150" cy="120" r="6" />
    <circle cx="150" cy="175" r="6" />

    
    <circle cx="360" cy="45" r="5.5" />
    <circle cx="360" cy="95" r="6.5">
      <animate attributeName="r" values="6;7.5;6" dur="2.6s" repeatCount="indefinite" />
    </circle>
    <circle cx="360" cy="145" r="6.5">
      <animate attributeName="r" values="6;7.5;6" dur="2.8s" begin="0.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="360" cy="195" r="5.5" />

    
    <circle cx="570" cy="65" r="6" />
    <circle cx="570" cy="120" r="7">
      <animate attributeName="r" values="6.5;8;6.5" dur="3.1s" begin="0.4s" repeatCount="indefinite" />
    </circle>
    <circle cx="570" cy="175" r="6" />

    
    <circle cx="750" cy="90" r="7" fill="#ff2a4b" fill-opacity="0.25" />
    <circle cx="750" cy="150" r="7" fill="#ff2a4b" fill-opacity="0.25" />
  </g>
</svg>
