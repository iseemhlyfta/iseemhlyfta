<svg width="900" height="200" viewBox="0 0 900 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    
    <linearGradient id="topGlow" x1="0" y1="0" x2="0" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff2a4b" stop-opacity="0.55" />
      <stop offset="45%" stop-color="#7a0016" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0" />
    </linearGradient>

    
    <linearGradient id="sideFade" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="white" stop-opacity="0" />
      <stop offset="12%" stop-color="white" stop-opacity="1" />
      <stop offset="88%" stop-color="white" stop-opacity="1" />
      <stop offset="100%" stop-color="white" stop-opacity="0" />
    </linearGradient>

    <mask id="headerMask">
      <rect width="900" height="200" fill="url(#sideFade)" />
    </mask>

    
    <filter id="grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.78" numOctaves="3" stitchTiles="stitch" result="noise" />
      <feColorMatrix type="saturate" values="0" in="noise" result="mono" />
      <feComponentTransfer in="mono" result="alpha">
        <feFuncA type="linear" slope="0.18" />
      </feComponentTransfer>
      <feComposite in="alpha" in2="SourceGraphic" operator="in" result="clipped" />
      <feBlend mode="overlay" in="clipped" in2="SourceGraphic" />
    </filter>
  </defs>

  
  <g mask="url(#headerMask)">
    <rect width="900" height="175" fill="url(#topGlow)" filter="url(#grain)" />
    <line x1="120" y1="1.5" x2="780" y2="1.5" stroke="#ff2a4b" stroke-width="2" stroke-opacity="0.85" />
  </g>

  
  <text x="450" y="108" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Helvetica, Arial, sans-serif" font-size="58" font-weight="800" letter-spacing="-1.8">
    iseemhlyfta<tspan fill="#ff2a4b">.</tspan>
  </text>

  
  <text x="450" y="146" text-anchor="middle" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14.5" letter-spacing="0.4">
    applied ai  ·  python &amp; rust  ·  open source
  </text>
</svg>
